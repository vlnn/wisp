[project]
name = "wisp"
version = "0.1.0"
description = "Alfred workflow for one-line logs and tasks: type l, see them newest first, keep, mark done, rename, trash"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wisp = "wisp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-mock>=3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wisp", "conftest"]

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
